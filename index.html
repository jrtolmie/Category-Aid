<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Master-Word Solver</title>
    <style>
        :root {
            --bg-color: #0f0f1a;
            --card-bg: #1a1a2e;
            --accent-color: #7f5af0;
            --text-color: #fffffe;
            --text-muted: #94a1b2;
            --border-color: #24243e;
            --success-color: #2cb67d;
            --reset-bg: #2b2b40;
            --warning-color: #ffb521;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
        }
        h1 {
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 24px;
            color: var(--accent-color);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: var(--text-muted);
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            background-color: #0f0f1a;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: var(--accent-color);
        }
        input:focus::placeholder {
            color: transparent;
        }
        .letters-container {
            display: flex;
            gap: 15px;
        }
        .letters-container .form-group {
            flex: 1;
        }
        .char-input {
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
        }
        .actions-container {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }
        button {
            padding: 14px;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-sizing: border-box;
        }
        #solveBtn {
            flex: 2;
            background-color: var(--accent-color);
        }
        #solveBtn:hover {
            background-color: #6b46c1;
        }
        #resetBtn {
            flex: 1;
            background-color: var(--reset-bg);
            color: var(--text-muted);
        }
        #resetBtn:hover {
            background-color: #3b3b54;
            color: var(--text-color);
        }
        .results-section {
            margin-top: 30px;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
            display: none;
        }
        .results-header {
            font-size: 1.1rem;
            margin-bottom: 8px;
            color: var(--success-color);
        }
        .ambiguity-warning {
            font-size: 0.85rem;
            color: var(--warning-color);
            background: rgba(255, 181, 33, 0.1);
            border: 1px solid rgba(255, 181, 33, 0.2);
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: none;
            line-height: 1.3;
        }
        .word-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .word-item {
            background: #24243e;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 0.95rem;
            text-transform: capitalize;
            border-left: 3px solid var(--accent-color);
        }
        .no-results {
            color: var(--text-muted);
            font-style: italic;
            text-align: center;
            grid-column: span 2;
            padding: 20px 0;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🔮 Mind Reader Assistant</h1>
    <div class="form-group">
        <label for="categoryWord">Category Example Word</label>
        <input type="text" id="categoryWord" placeholder="e.g., elephant, spoon, guitar">
    </div>
    <div class="letters-container">
        <div class="form-group">
            <label for="letter1">1st Letter of Master-Word</label>
            <input type="text" id="letter1" class="char-input" maxlength="1" placeholder="A">
        </div>
        <div class="form-group">
            <label for="letter2">2nd Letter of Master-Word</label>
            <input type="text" id="letter2" class="char-input" maxlength="1" placeholder="B">
        </div>
    </div>
    <div class="actions-container">
        <button id="solveBtn">Filter Options</button>
        <button id="resetBtn">Reset</button>
    </div>
    <div class="results-section" id="resultsSection">
        <div class="ambiguity-warning" id="ambiguityWarning"></div>
        <div class="results-header" id="resultsCount">Possible Master-Words:</div>
        <ul class="word-list" id="wordList"></ul>
    </div>
</div>
<script>
const KNOWLEDGE_BASE = {
    "animal": ["elephant", "lion", "tiger", "bear", "monkey", "giraffe", "zebra", "kangaroo", "hippo", "rhino", "leopard", "cheetah", "panda", "koala", "gorilla", "camel", "donkey", "horse", "sheep", "goat", "wolf", "fox", "rabbit", "deer", "moose", "squirrel", "hamster", "mouse", "rat", "bat", "whale", "dolphin", "shark", "octopus", "turtle", "snake", "lizard", "alligator", "crocodile", "frog", "eagle", "hawk", "owl", "parrot", "penguin", "flamingo", "peacock", "swan", "duck", "goose", "chicken", "turkey", "dog", "cat"],
    "fruit": ["banana", "apple", "orange", "grape", "strawberry", "blueberry", "raspberry", "watermelon", "peach", "pear", "plum", "cherry", "apricot", "mango", "papaya", "pineapple", "coconut", "lemon", "lime", "grapefruit", "kiwi", "fig", "date", "pomegranate", "avocado"],
    "tool": ["hammer", "screwdriver", "pliers", "wrench", "saw", "drill", "chisel", "mallet", "axe", "level", "trowel", "shovel", "rake", "hoe", "file", "clamp", "vise", "anvil", "crowbar", "ladder", "tape", "scissors"],
    "vegetable": ["carrot", "broccoli", "cauliflower", "spinach", "lettuce", "cabbage", "kale", "celery", "asparagus", "cucumber", "zucchini", "eggplant", "pumpkin", "squash", "radish", "turnip", "beet", "potato", "onion", "garlic", "leek", "pepper", "tomato", "corn", "pea", "bean", "mushroom"],
    "vehicle": ["car", "truck", "bus", "van", "motorcycle", "bicycle", "scooter", "train", "tram", "subway", "airplane", "helicopter", "jet", "rocket", "spaceship", "boat", "ship", "yacht", "submarine", "ferry", "tractor", "ambulance", "limousine"],
    "clothing": ["shirt", "pants", "trousers", "jeans", "shorts", "skirt", "dress", "suit", "jacket", "coat", "sweater", "hoodie", "blouse", "vest", "socks", "shoes", "boots", "sneakers", "sandals", "slippers", "hat", "cap", "beanie", "scarf", "gloves", "tie", "belt"],
    "furniture": ["chair", "table", "desk", "bed", "sofa", "couch", "armchair", "stool", "bench", "dresser", "wardrobe", "closet", "cabinet", "bookcase", "shelf", "nightstand", "mattress"],
    "kitchenware": ["spoon", "fork", "knife", "plate", "bowl", "mug", "glass", "cup", "pot", "pan", "kettle", "toaster", "blender"],
    "stationery": ["pen", "pencil", "marker", "eraser", "ruler", "stapler", "binder", "folder", "crayon", "notebook"],
    "toy": ["doll", "ball", "puzzle", "block", "yo-yo", "marble", "robot", "kite", "balloon"],
    "appliance": ["fridge", "oven", "stove", "washer", "dryer", "iron", "vacuum", "fan", "heater", "clock"],
    "flower": ["rose", "tulip", "daisy", "lily", "orchid", "sunflower", "lotus", "violet", "poppy"],
    "tree": ["oak", "pine", "maple", "birch", "palm", "willow", "cedar", "redwood", "elm"],
    "weather": ["rain", "snow", "wind", "storm", "cloud", "fog", "hail", "frost", "thunder", "lightning"],
    "metal": ["gold", "silver", "copper", "iron", "bronze", "steel", "zinc", "lead", "tin"],
    "instrument": ["guitar", "piano", "violin", "flute", "drum", "trumpet", "cello", "harp", "banjo", "organ"],
    "weapon": ["sword", "shield", "spear", "bow", "arrow", "dagger", "pistol", "rifle", "cannon", "knife"],
    "sport": ["soccer", "tennis", "golf", "rugby", "hockey", "cricket", "squash", "skiing"],
    "planet": ["mercury", "venus", "earth", "mars", "jupiter", "saturn", "uranus", "neptune", "pluto", "sun"],
    "shape": ["circle", "square", "sphere", "cube", "cone", "pyramid", "oval", "ring", "cross", "triangle", "star", "3 wavy lines"],
    "body": ["arm", "leg", "hand", "foot", "head", "face", "eye", "nose", "mouth", "ear", "neck", "back"],
    "placeholder1": ["wordone", "wordtwo", "wordthree"],
    "placeholder2": ["wordone", "wordtwo", "wordthree"],
    "placeholder3": ["wordone", "wordtwo", "wordthree"],
    "placeholder4": ["wordone", "wordtwo", "wordthree"],
    "placeholder5": ["wordone", "wordtwo", "wordthree"]
};
function findCategoryData(word) {
    word = word.toLowerCase().trim();
    let matches = [];
    for (const [cat, words] of Object.entries(KNOWLEDGE_BASE)) {
        if (words.includes(word) || words.some(w => w+'s'===word || word+'s'===w)) {
            matches.push(cat);
        }
    }
    return {
        primary: matches.length > 0 ? matches[0] : null,
        allMatches: matches
    };
}

document.getElementById('letter1').addEventListener('input', function() {
    if (this.value.length === 1) document.getElementById('letter2').focus();
});

document.getElementById('solveBtn').addEventListener('click', function() {
    const wordInput = document.getElementById('categoryWord').value.trim().toLowerCase();
    const l1 = document.getElementById('letter1').value.trim().toLowerCase();
    const l2 = document.getElementById('letter2').value;
    
    if (!wordInput) { alert("Please enter a category example word."); return; }
    
    const catData = findCategoryData(wordInput);
    const cat = catData.primary;
    const sect = document.getElementById('resultsSection');
    const list = document.getElementById('wordList');
    const head = document.getElementById('resultsCount');
    const warn = document.getElementById('ambiguityWarning');
    
    list.innerHTML = '';
    sect.style.display = 'block';
    warn.style.display = 'none';
    
    if (!cat) {
        list.innerHTML = `<li class="no-results">Category not recognized for "${wordInput}".</li>`;
        head.textContent = "Error";
        return;
    }
    
    if (catData.allMatches.length > 1) {
        const uppercaseMatches = catData.allMatches.map(m => m.toUpperCase());
        warn.innerHTML = `⚠️ <strong>Ambiguous Word:</strong> "${wordInput}" fits multiple categories.<br>• Loaded: <strong>${uppercaseMatches[0]}</strong><br>• Alternates: ${uppercaseMatches.slice(1).join(', ')}`;
        warn.style.display = 'block';
    }
    
    const targetL1 = l1.toLowerCase();
    const targetL2 = l2.toLowerCase();
    
    const filtered = KNOWLEDGE_BASE[cat].filter(w => {
        const lowerW = w.toLowerCase();
        return (!targetL1 || lowerW.startsWith(targetL1)) && (!targetL2 || lowerW.charAt(1) === targetL2);
    });
    
    if (filtered.length === 0) {
        list.innerHTML = '<li class="no-results">No words match these letter constraints.</li>';
        head.textContent = `Category: ${cat.toUpperCase()} (0 matches)`;
    } else {
        head.textContent = `Category: ${cat.toUpperCase()} (${filtered.length} match${filtered.length>1?'es':''})`;
        filtered.forEach(w => {
            const li = document.createElement('li');
            li.className = 'word-item';
            li.textContent = w;
            list.appendChild(li);
        });
    }
});

document.getElementById('resetBtn').addEventListener('click', function() {
    document.getElementById('categoryWord').value = '';
    document.getElementById('letter1').value = '';
    document.getElementById('letter2').value = '';
    document.getElementById('wordList').innerHTML = '';
    document.getElementById('ambiguityWarning').style.display = 'none';
    document.getElementById('resultsSection').style.display = 'none';
    document.getElementById('categoryWord').focus();
});
</script>
</body>
</html>
